<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dự án Thư viện ảnh Đáp ứng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Thư Viện Ảnh Thiên Nhiên & Nhiếp Ảnh</h1>
  </header>

  <main>
    <div class="gallery">
      
      <figure>
        <img src="https://picsum.photos/id/1015/600/400" alt="Cảnh bình minh hoang sơ trên hồ nước phẳng lặng giữa rặng núi">
        <figcaption>
          <p>Bình minh yên bình trên hồ nước miền núi, mang lại cảm giác thư thái và gần gũi với thiên nhiên.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1018/600/400" alt="Con đường nhỏ uốn lượn xuyên qua ngọn núi đá hùng vĩ">
        <figcaption>
          <p>Con đường uốn lượn dẫn lối qua những dãy núi trập trùng, gợi mở chuyến hành trình phiêu lưu.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1025/600/400" alt="Chú chó nhỏ đáng yêu đang ngồi ngoan ngoãn trên thảm cỏ xanh">
        <figcaption>
          <p>Hình ảnh cún cưng ngây thơ đang tận hưởng ánh nắng ấm áp của một buổi sáng mùa hè.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1039/600/400" alt="Rừng cây xanh mướt lung linh dưới những tia nắng xuyên qua kẽ lá">
        <figcaption>
          <p>Thảm thực vật phong phú trong lòng rừng nguyên sinh, nơi lưu giữ sự sống của muôn loài.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1043/600/400" alt="Sóng biển rì rào vỗ nhẹ vào bờ cát mịn lúc hoàng hôn">
        <figcaption>
          <p>Hoàng hôn tuyệt đẹp trên bãi biển hoang sơ với tiếng sóng biển vỗ rì rào êm dịu.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1069/600/400" alt="Cây cầu gỗ cổ kính bắc qua dòng suối nhỏ lấp lánh">
        <figcaption>
          <p>Cây cầu gỗ rêu phong cổ kính tạo nên vẻ đẹp hoài niệm giữa không gian tĩnh lặng.</p>
        </figcaption>
      </figure>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 Bài tập Dự án Thư viện ảnh đáp ứng.</p>
  </footer>

</body>
</html>
